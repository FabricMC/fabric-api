plugins {
	id 'fabric-api.module'
}

loom {
	accessWidenerPath = file('src/client/resources/fabric-key-mapping-api-v1.classtweaker')
}

fabricApiModule {
	moduleDependencies(
		'fabric-api-base',
		'fabric-screen-api-v1'
	)

	testDependencies(
		':fabric-api-base',
		':fabric-client-gametest-api-v1',
		':fabric-lifecycle-events-v1',
		':fabric-resource-loader-v1'
	)
}
