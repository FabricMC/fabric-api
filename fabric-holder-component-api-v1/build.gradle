version = getSubprojectVersion(project)

moduleDependencies(project, [
	'fabric-api-base',
	'fabric-data-generation-api-v1',
	'fabric-networking-api-v1',
	'fabric-resource-conditions-api-v1'
])

testDependencies(project, [
	'fabric-command-api-v2'
])

fabricApi {
	configureDataGeneration {
		outputDirectory = file("src/testmod/generated")
		addToResources = false
		strictValidation = true
	}
}

runDatagen {
	outputs.dir("src/testmod/generated")
}

sourceSets {
	testmod {
		resources {
			srcDirs += [
				'src/testmod/generated'
			]
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/fabric-holder-component-api-v1.classtweaker")

	runs {
		datagen {
			name "Data Generation"
			source sourceSets.testmod
			ideConfigGenerated = true
		}
	}
}

generateResources.dependsOn runDatagen
