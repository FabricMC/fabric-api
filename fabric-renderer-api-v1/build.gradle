plugins {
	id 'fabric-api.module'
}

fabricApiModule {
	moduleDependencies(
		':fabric-api-base',
		':fabric-rendering-v1',
		':fabric-transitive-access-wideners-v1'
	)

	testDependencies(
		':fabric-block-api-v1',
		':fabric-block-getter-api-v2',
		':fabric-model-loading-api-v1',
		':fabric-object-builder-api-v1',
		':fabric-particles-v1',
		':fabric-renderer-indigo',
		':fabric-rendering-v1',
		':fabric-resource-loader-v1'
	)
}

loom {
	accessWidenerPath = file('src/client/resources/fabric-renderer-api-v1.classtweaker')
}
