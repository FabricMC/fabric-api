import net.fabricmc.fabric.impl.build.BumpVersionTask
import net.fabricmc.fabric.impl.build.FabricApiBuildUtils

if (project == rootProject) {
	version = FabricApiBuildUtils.rootVersion(project)
	logger.lifecycle("Building Fabric: " + version)
	def bumpVersions = tasks.register('bumpVersions', BumpVersionTask) {
		gradlePropertiesFile.set(layout.projectDirectory.file("gradle.properties"))
	}

	gradle.projectsEvaluated {
		def moduleProjects = rootProject.allprojects.findAll {
			FabricApiBuildUtils.isFabricModule(it) && it != rootProject
		}

		bumpVersions.configure {
			moduleNames.set(moduleProjects.collect { it.name })
			moduleVersions.set(moduleProjects.collectEntries {
				[(it.name): it.findProperty("${it.name}-version").toString()]
			})
			apiDependencies.set(moduleProjects.collectEntries {
				def api = it.configurations.findByName("api")
				[(it.name): api == null ? "" : api.allDependencies.collect { dependency -> dependency.name }.join(",")]
			})
		}
	}
} else {
	version = FabricApiBuildUtils.moduleVersion(project)
}
