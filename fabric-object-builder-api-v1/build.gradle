plugins {
	id 'fabric-api.module'
}

fabricApiModule {
	moduleDependencies(
		'fabric-api-base',
		'fabric-registry-sync-v0',
		'fabric-resource-loader-v1'
	)

	testDependencies(
		':fabric-command-api-v2',
		':fabric-lifecycle-events-v1',
		':fabric-rendering-v1'
	)
}

loom {
	accessWidenerPath = file("src/main/resources/fabric-object-builder-api-v1.classtweaker")
}
