import net.fabricmc.fabric.impl.build.AbstractGenerateClassTweakerTask

import org.gradle.api.tasks.TaskAction
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes
import org.objectweb.asm.Type

plugins {
	id 'fabric-api.module'
}

loom {
	accessWidenerPath = file('src/main/resources/fabric-transitive-access-wideners-v1.classtweaker')
}

fabricApiModule {
	testDependencies(
		':fabric-rendering-v1',
		':fabric-object-builder-api-v1'
	)
}

abstract class GenerateTransitiveAccessWidenersClassTweakerTask extends AbstractGenerateClassTweakerTask {
	@TaskAction
	void run() {
		List<String> lines = new ArrayList<>()
		addHeader(lines, "accessWidener v2 official")

		generateBlockConstructors(lines)
		lines.add("")
		generateCreatorEntityTrackedDataMethods(lines)
		lines.add("")
		generateEnchantmentMethods(lines)
		lines.add("")
		generateNoiseRouterDataFieldsAndMethods(lines)
		lines.add("")
		generateRenderPipelinesFields(lines)
		lines.add("")
		generateBuiltInBlockModelsMethods(lines)

		validateAccessWidener(lines)
		writeOutput(lines)
	}

	private void generateBlockConstructors(List<String> lines) {
		lines.add("# Constructors of non-abstract block classes")

		readPackageClasses("net/minecraft/world/level/block")
				.toSorted { it.name }
				.findAll { (it.access & Opcodes.ACC_ABSTRACT) == 0 }
				.forEach { node ->
					for (def method : node.methods) {
						def takesBlockProperties = Type.getArgumentTypes(method.desc).any {
							it.internalName == "net/minecraft/world/level/block/state/BlockBehaviour\$Properties"
						}

						if (method.name == "<init>" && takesBlockProperties && (method.access & Opcodes.ACC_PUBLIC) == 0) {
							lines.add("transitive-accessible method ${node.name} <init> ${method.desc}")
						}
					}
				}
	}

	private void generateRenderPipelinesFields(List<String> lines) {
		lines.add("# private fields of RenderPipelines")
		def node = readClass("net/minecraft/client/renderer/RenderPipelines")

		for (def field : node.fields) {
			if ((field.access & Opcodes.ACC_PRIVATE) != 0 && field.desc == "Lcom/mojang/renderpearl/api/pipeline/RenderPipeline\$Snippet;") {
				lines.add("transitive-accessible field ${node.name} ${field.name} ${field.desc}")
			}
		}

		for (def method : node.methods) {
			if ((method.access & Opcodes.ACC_PRIVATE) != 0 && (method.access & Opcodes.ACC_STATIC) != 0 && !method.name.startsWith("lambda")) {
				lines.add("transitive-accessible method ${node.name} ${method.name} ${method.desc}")
			}
		}
	}

	private void generateNoiseRouterDataFieldsAndMethods(List<String> lines) {
		lines.add("# private fields of NoiseRouterData")
		def node = readClass("net/minecraft/world/level/levelgen/NoiseRouterData")

		for (def field : node.fields) {
			if ((field.access & Opcodes.ACC_PRIVATE) != 0) {
				lines.add("transitive-accessible field ${node.name} ${field.name} ${field.desc}")
			}
		}

		lines.add("# private and protected methods of NoiseRouterData")

		for (def method : node.methods) {
			if ((method.access & (Opcodes.ACC_PRIVATE | Opcodes.ACC_PROTECTED)) != 0 && !method.name.startsWith("lambda") && method.name != "createKey") {
				lines.add("transitive-accessible method ${node.name} ${method.name} ${method.desc}")
			}
		}
	}

	private void generateTrackedDataFields(String className, List<String> lines, String... extraMethods) {
		Set<String> collectedWideners = new LinkedHashSet<>()

		readClass(className).accept(new ClassVisitor(Opcodes.ASM9) {
			@Override
			MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
				boolean isExtra = extraMethods.contains(name)

				if (!isExtra && !isTrackedDataAccessor(name, descriptor)) {
					return null
				}

				return new MethodVisitor(Opcodes.ASM9) {
					@Override
					void visitFieldInsn(int opcode, String owner, String fieldName, String fieldDescriptor) {
						if (isExtra || fieldName == "entityData" && opcode == Opcodes.GETFIELD) {
							collectedWideners.add("transitive-accessible method ${className} ${name} ${descriptor}")
						}
					}
				}
			}
		})

		lines.addAll(collectedWideners)
	}

	private void generateCreatorEntityTrackedDataMethods(List<String> lines) {
		lines.add("# Private tracked data related methods of DisplayEntity (plus its subclasses) and InteractionEntity")
		generateTrackedDataFields("net/minecraft/world/entity/Display", lines, "getTransformation")
		generateTrackedDataFields("net/minecraft/world/entity/Display\$ItemDisplay", lines)
		generateTrackedDataFields("net/minecraft/world/entity/Display\$BlockDisplay", lines)
		generateTrackedDataFields("net/minecraft/world/entity/Display\$TextDisplay", lines)
		generateTrackedDataFields("net/minecraft/world/entity/Interaction", lines, "shouldRespond")
	}

	private void generateEnchantmentMethods(List<String> lines) {
		lines.add("# Private methods of Enchantment and EnchantmentHelper")

		for (def node : [
				readClass("net/minecraft/world/item/enchantment/EnchantmentHelper"),
				readClass("net/minecraft/world/item/enchantment/Enchantment")
		]) {
			for (def method : node.methods) {
				if ((method.access & Opcodes.ACC_PRIVATE) != 0 && !method.name.startsWith("lambda\$")) {
					lines.add("transitive-accessible method ${node.name} ${method.name} ${method.desc}")
				}
			}
		}

		lines.add("transitive-accessible class net/minecraft/world/item/enchantment/EnchantmentHelper\$EnchantmentVisitor")
		lines.add("transitive-accessible class net/minecraft/world/item/enchantment/EnchantmentHelper\$EnchantmentInSlotVisitor")
		lines.add("transitive-accessible class net/minecraft/world/item/enchantment/Enchantment\$GenericAction")
		lines.add("transitive-accessible class net/minecraft/world/item/enchantment/Enchantment\$FloatAction")
	}

	private void generateBuiltInBlockModelsMethods(List<String> lines) {
		lines.add("# Private methods of BuiltInBlockModels and BuiltInBlockModels\$Builder")

		for (def node : [
				readClass("net/minecraft/client/renderer/block/BuiltInBlockModels"),
				readClass("net/minecraft/client/renderer/block/BuiltInBlockModels\$Builder")
		]) {
			for (def method : node.methods) {
				if ((method.access & Opcodes.ACC_PRIVATE) != 0 && !method.name.startsWith("lambda\$")) {
					lines.add("transitive-accessible method ${node.name} ${method.name} ${method.desc}")
				}
			}
		}

		lines.add("transitive-accessible class net/minecraft/client/renderer/block/BuiltInBlockModels\$Builder")
		lines.add("transitive-accessible class net/minecraft/client/renderer/block/BuiltInBlockModels\$ModelFactory")
		lines.add("transitive-accessible class net/minecraft/client/renderer/block/BuiltInBlockModels\$SpecialModelFactory")
	}

	private static boolean isTrackedDataAccessor(String name, String descriptor) {
		int parameterCount = Type.getArgumentCount(descriptor)

		if (name.startsWith("get")) {
			return parameterCount == 0
		}

		if (name.startsWith("set")) {
			return parameterCount == 1
		}

		return false
	}

	private static void validateAccessWidener(List<String> lines) {
		List<String> exceptions = new ArrayList<>()

		for (int i = 0; i < lines.size(); i++) {
			String line = lines.get(i)

			if (line.isBlank() || line.startsWith("#") || line.startsWith("transitive-") || line.startsWith("accessWidener")) {
				continue
			}

			exceptions.add(String.valueOf(i + 1))
		}

		if (!exceptions.isEmpty()) {
			throw new RuntimeException("\"fabric-transitive-access-wideners-v1.classtweaker\" contains non-transitive access modifiers at lines: [${String.join(", ", exceptions)}]")
		}
	}
}

tasks.register('generateClassTweaker', GenerateTransitiveAccessWidenersClassTweakerTask) {
	template = file("template.classtweaker")
	outputFile = file("src/main/resources/fabric-transitive-access-wideners-v1.classtweaker")
}

generateResources.dependsOn generateClassTweaker
processResources.mustRunAfter generateClassTweaker
