import net.fabricmc.loom.task.ValidateMixinNameTask
import net.fabricmc.fabric.impl.build.FabricApiBuildUtils

def debugArgs = [
		"-enableassertions",
		"-Dmixin.debug.verify=true",
		"-Dmixin.debug.countInjections=true",
		"-Dmixin.checks.interfaces=true",
		"-Dfabric.resource_loader.debug.reloaders_identity.strict=true",
		"-XX:+UseZGC",
		"-XX:+UseCompactObjectHeaders",
		"-XX:+AlwaysPreTouch",
		"-XX:+UseStringDeduplication"
]

sourceSets {
	testmod {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
	}

	testmodClient {
		compileClasspath += main.compileClasspath
		runtimeClasspath += main.runtimeClasspath
		compileClasspath += client.compileClasspath
		runtimeClasspath += client.runtimeClasspath

		compileClasspath += testmod.compileClasspath
		runtimeClasspath += testmod.runtimeClasspath
	}

	test {
		compileClasspath += testmodClient.compileClasspath
		runtimeClasspath += testmodClient.runtimeClasspath
	}
}

loom {
	runs {
		testmodClient {
			client()
			ideConfigGenerated project.rootProject == project
			name = "Testmod Client"
			source sourceSets.testmodClient
		}
		testmodServer {
			server()
			ideConfigGenerated project.rootProject == project
			name = "Testmod Server"
			source sourceSets.testmod
		}
	}
}

loom.runs.configureEach {
	vmArgs(debugArgs)
}

dependencies {
	testmodImplementation sourceSets.main.output
	testmodClientImplementation sourceSets.main.output
	testmodClientImplementation sourceSets.client.output
	testmodClientImplementation sourceSets.testmod.output

	testImplementation FabricApiBuildUtils.library(project, "fabric-loader-junit")
	testImplementation sourceSets.testmodClient.output
	testImplementation FabricApiBuildUtils.library(project, "mockito-core")
}

test {
	useJUnitPlatform()
	jvmArgs(debugArgs)
}

tasks.register('testmodJar', Jar) {
	from sourceSets.testmod.output
	from sourceSets.testmodClient.output
	archiveClassifier = "testmod"
}

build.dependsOn testmodJar

tasks.register('validateMixinNames', ValidateMixinNameTask) {
	source(sourceSets.main.output)
	source(sourceSets.client.output)
	source(sourceSets.testmod.output)
	outputs.upToDateWhen { true }
}

check.dependsOn "validateMixinNames"

// Testmods need selected modules' client outputs, resolved through their internal outgoing variant.
def clientOutputDependencies = configurations.dependencyScope("fabricApiClientOutputDependencies")
def clientOutputs = configurations.resolvable("fabricApiClientOutputs") {
	extendsFrom clientOutputDependencies
	FabricApiBuildUtils.configureJavaRuntimeClassesVariant(delegate, "client")
}

def addClientOutputDependency = { String projectPath ->
	dependencies.add(clientOutputDependencies.name, dependencies.project(path: projectPath, configuration: "fabricApiClientOutputElements"))
}

dependencies {
	testmodClientImplementation files(clientOutputs)

	if (project.name != "fabric-gametest-api-v1" && rootProject.findProject(":fabric-gametest-api-v1") != null) {
		testmodImplementation project(path: ':fabric-gametest-api-v1')
		addClientOutputDependency(":fabric-gametest-api-v1")
		testmodImplementation project(path: ':fabric-resource-loader-v1')
		addClientOutputDependency(":fabric-resource-loader-v1")
	}

	if (project.name != "fabric-registry-sync-v0" && rootProject.findProject(":fabric-registry-sync-v0") != null) {
		testmodRuntimeOnly project(path: ':fabric-registry-sync-v0')
		addClientOutputDependency(":fabric-registry-sync-v0")
	}
}
