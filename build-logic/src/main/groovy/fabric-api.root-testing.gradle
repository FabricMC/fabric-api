import net.fabricmc.fabric.impl.build.FabricApiBuildUtils
import org.gradle.api.attributes.Attribute
import org.gradle.api.attributes.Category
import org.gradle.api.attributes.LibraryElements
import org.gradle.api.attributes.Usage

plugins {
	id "fabric-api.testing"
}

def includedModuleProjects = rootProject.allprojects.findAll {
	FabricApiBuildUtils.isFabricModule(it) && it != project
}

// Root gametest consumes module-published testmod outputs without reading child sourceSets directly.
def fabricApiSourceSetAttribute = Attribute.of("net.fabricmc.fabric-api.source-set", String)
def nestedTestmodJarDependencies = configurations.dependencyScope("fabricApiNestedTestmodJarDependencies")
def nestedTestModJars = configurations.resolvable("fabricApiNestedTestmodJars") {
	extendsFrom nestedTestmodJarDependencies.get()

	attributes {
		attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
		attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
		attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
	}
}

def moduleTestmodOutputDependencies = configurations.dependencyScope("fabricApiModuleTestmodOutputDependencies")
def moduleTestmodOutputs = configurations.resolvable("fabricApiModuleTestmodOutputs") {
	extendsFrom moduleTestmodOutputDependencies.get()

	attributes {
		attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
		attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
		attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.CLASSES))
		attribute(fabricApiSourceSetAttribute, "testmod")
	}
}

def moduleTestmodClientOutputDependencies = configurations.dependencyScope("fabricApiModuleTestmodClientOutputDependencies")
def moduleTestmodClientOutputs = configurations.resolvable("fabricApiModuleTestmodClientOutputs") {
	extendsFrom moduleTestmodClientOutputDependencies.get()

	attributes {
		attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
		attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
		attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.CLASSES))
		attribute(fabricApiSourceSetAttribute, "testmodClient")
	}
}

for (def moduleProject : includedModuleProjects) {
	loom.mods.register(moduleProject.name) {
		sourceSet "main", moduleProject.path
		sourceSet "client", moduleProject.path
	}

	loom.mods.register(moduleProject.name + "-testmod") {
		sourceSet "testmod", moduleProject.path
		sourceSet "testmodClient", moduleProject.path
	}
}

dependencies {
	testmodImplementation files(moduleTestmodOutputs)
	testmodClientImplementation files(moduleTestmodClientOutputs)

	for (def moduleProject : includedModuleProjects) {
		add(moduleTestmodOutputDependencies.name, dependencies.project(path: moduleProject.path, configuration: "fabricApiTestmodOutputElements"))
		add(moduleTestmodClientOutputDependencies.name, dependencies.project(path: moduleProject.path, configuration: "fabricApiTestmodClientOutputElements"))

		if (moduleProject.file("src/testmod").exists() || moduleProject.file("src/testmodClient").exists()) {
			add(nestedTestmodJarDependencies.name, dependencies.project(path: moduleProject.path, configuration: "fabricApiTestmodJarElements"))
		}
	}
}

loom {
	runs {
		gametest {
			inherit testmodServer
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file("junit.xml").get().getAsFile()}"
			runDir "build/gametest"
			source sourceSets.testmod
		}
		autoTestServer {
			inherit testmodServer
			name "Auto Test Server"
			vmArg "-Dfabric.autoTest"
			source sourceSets.testmod
		}
		clientGametest {
			inherit testmodClient
			name "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			vmArg "-Dfabric-tag-conventions-v2.missingTagTranslationWarning=fail"
			vmArg "-Dfabric-tag-conventions-v1.legacyTagWarning=fail"
			source sourceSets.testmodClient
		}
	}
}

runGametest {
	outputs.file project.layout.buildDirectory.file("junit.xml")
}

loom.nestJars(tasks.named("testmodJar"), nestedTestModJars.get())
