import groovy.xml.XmlSlurper
import net.fabricmc.fabric.impl.build.FabricApiBuildUtils
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.external.javadoc.JavadocMemberLevel

plugins {
	id "fabric-api.base-publishing"
	id "me.modmuss50.mod-publish-plugin"
}

def includedModuleProjects = rootProject.allprojects.findAll {
	FabricApiBuildUtils.isFabricModule(it) && it != project
}

// Resolve module-published source/classpath variants for the aggregate root Javadoc task.
def moduleJavadocSourceDependencies = configurations.dependencyScope("fabricApiModuleJavadocSourceDependencies")
def moduleJavadocSources = configurations.resolvable("fabricApiModuleJavadocSources") {
	extendsFrom moduleJavadocSourceDependencies.get()
	FabricApiBuildUtils.configureDocumentationSourcesVariant(project, delegate)
}

def moduleJavadocClasspathDependencies = configurations.dependencyScope("fabricApiModuleJavadocClasspathDependencies")
def moduleJavadocClasspath = configurations.resolvable("fabricApiModuleJavadocClasspath") {
	extendsFrom moduleJavadocClasspathDependencies.get()
	FabricApiBuildUtils.configureJavaApiClassesVariant(project, delegate)
}

javadoc {
	enabled = true
	source moduleJavadocSources
	classpath = files(sourceSets.main.compileClasspath, sourceSets.client.compileClasspath, moduleJavadocClasspath)

	options {
		source = "25"
		encoding = "UTF-8"
		charSet = "UTF-8"
		memberLevel = JavadocMemberLevel.PACKAGE
		addStringOption("Xdoclint:all,-missing", "-quiet")
		addBooleanOption("-syntax-highlight", true)

		tags(
				'apiNote:a:API Note:',
				'implSpec:a:Implementation Requirements:',
				'implNote:a:Implementation Note:'
				)
	}

	include("**/api/**")
	failOnError = true
}

tasks.register('javadocJar', Jar) {
	dependsOn javadoc
	from javadoc.destinationDir
	archiveClassifier = "fatjavadoc"
}

build.dependsOn javadocJar

remoteSign {
	sign jar
}

String archivesName = project.base.archivesName.get()
[jar, sourcesJar].each {
	it.from(rootProject.file("LICENSE")) {
		rename { "${it}-${archivesName}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact(signJar.output) {
				builtBy(signJar)
			}

			artifact(sourcesJar) {
				builtBy sourcesJar
			}

			artifact javadocJar
			artifact testmodJar

			pom {
				FabricApiBuildUtils.addPomMetadataInformation(rootProject, pom)
			}
		}
	}
}

dependencies {
	for (def moduleProject : includedModuleProjects) {
		add(moduleJavadocSourceDependencies.name, dependencies.project(path: moduleProject.path, configuration: "fabricApiJavadocSourcesElements"))
		add(moduleJavadocClasspathDependencies.name, dependencies.project(path: moduleProject.path, configuration: "fabricApiJavadocClasspathElements"))
	}
}

loom.disableDeprecatedPomGeneration(publishing.publications.mavenJava)

publishMods {
	file = signJar.output
	changelog = providers.environmentVariable("CHANGELOG").getOrElse("No changelog provided")
	type = project.prerelease == "true" ? BETA : STABLE
	displayName = "[${project.minecraft_version}] Fabric API $project.version"
	modLoaders.add("fabric")
	dryRun = providers.environmentVariable("CURSEFORGE_API_KEY").getOrNull() == null

	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
		projectId = "306612"
		project.curseforge_minecraft_versions.split(",").each { minecraftVersions.add(it.trim()) }
		client = true
		server = true
	}

	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		projectId = "P7dR8mSH"
		minecraftVersions.add(project.minecraft_version)
		if (project.modrinth_extra_minecraft_versions) {
			project.modrinth_extra_minecraft_versions.split(",").each { minecraftVersions.add(it.trim()) }
		}
	}

	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = providers.environmentVariable("GITHUB_REPOSITORY").getOrElse("FabricMC/dryrun")
		commitish = providers.environmentVariable("GITHUB_REF_NAME").getOrElse("dryrun")
	}
}

assemble.dependsOn signJar

tasks.register('outJar', Copy) {
	from signJar.output
	into layout.buildDirectory.dir("out")
}

tasks.register('checkVersion') {
	doFirst {
		def xml = new URL("https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml").text
		def metadata = new XmlSlurper().parseText(xml)
		def versions = metadata.versioning.versions.version*.text()
		if (versions.contains(version)) {
			throw new RuntimeException("${version} has already been released!")
		}
	}
}

tasks.publishMods.dependsOn checkVersion
publish.mustRunAfter checkVersion

gradle.projectsEvaluated {
	publishing.publications.mavenJava {
		def dependencies = []

		for (def moduleProject : includedModuleProjects) {
			if (moduleProject.path.startsWith(":deprecated")) {
				continue
			}

			dependencies.add([
				'groupId': moduleProject.group,
				'artifactId': moduleProject.name,
				'version': FabricApiBuildUtils.moduleVersion(moduleProject),
				'scope': 'compile'
			])
		}

		def thisGroup = group
		def thisVersion = version

		pom.withXml {
			def depsNode = asNode().appendNode("dependencies")
			for (dep in dependencies) {
				def depNode = depsNode.appendNode("dependency")
				depNode.appendNode("groupId", dep['groupId'])
				depNode.appendNode("artifactId", dep['artifactId'])
				depNode.appendNode("version", dep['version'])
				depNode.appendNode("scope", dep['scope'])
			}

			def depNode = depsNode.appendNode("dependency")
			depNode.appendNode("groupId", thisGroup)
			depNode.appendNode("artifactId", "fabric-api-deprecated")
			depNode.appendNode("version", thisVersion)
			depNode.appendNode("scope", "compile")
		}
	}
}
